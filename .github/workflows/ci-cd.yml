name: Build & Deploy Studium-Notifications

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests with Pytest
        run: |
          PYTHONPATH=. pytest tests/ -v

  build-and-deploy:
    name: Build Docker Image & Deploy to EKS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-2' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: studium-notifications
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Update Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name studium-eks-cluster --region ${{ secrets.AWS_REGION || 'us-east-2' }}

      - name: Sync Secrets to Kubernetes
        run: |
          kubectl create namespace studium --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic studium-notifications-secrets \
            -n studium \
            --from-literal=AwsAccessKeyId="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            --from-literal=AwsSecretAccessKey="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Kubernetes
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|$IMAGE_URI|g" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl rollout status deployment/studium-notifications -n studium --timeout=300s

      - name: Debug Kubernetes Pods on Failure
        if: failure()
        run: |
          echo "=== POD STATUS ==="
          kubectl get pods -n studium -o wide || true
          echo "=== EVENTS ==="
          kubectl get events -n studium --sort-by='.metadata.creationTimestamp' || true
          echo "=== POD DESCRIBE ==="
          kubectl describe pods -n studium -l app=studium-notifications || true
          echo "=== CONTAINER LOGS ==="
          kubectl logs -n studium -l app=studium-notifications --all-containers --tail=200 || true
