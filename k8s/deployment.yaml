apiVersion: v1
kind: Namespace
metadata:
  name: studium
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: studium-notifications-config
  namespace: studium
data:
  ENVIRONMENT: "Production"
  AWS_REGION: "us-east-2"
  AWS_SQS_NOTIFICATIONS_QUEUE_NAME: "studium-notifications-queue"
  DYNAMODB_TABLE_NAME: "studium_notifications"
  SIMULATE_SES_EMAIL: "true"
  SES_SENDER_EMAIL: "notifications@studium.pucpr.br"
  PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studium-notifications
  namespace: studium
  labels:
    app: studium-notifications
spec:
  replicas: 1
  selector:
    matchLabels:
      app: studium-notifications
  template:
    metadata:
      labels:
        app: studium-notifications
    spec:
      containers:
        - name: studium-notifications
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: studium-notifications-config
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: studium-notifications-secrets
                  key: AwsAccessKeyId
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: studium-notifications-secrets
                  key: AwsSecretAccessKey
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: studium-notifications-service
  namespace: studium
  labels:
    app: studium-notifications
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      name: http
  selector:
    app: studium-notifications
